name: Python GTK smoke check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK Python runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-venv

      - name: Create Python environment
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r runtime-requirements.txt

      - name: Compile Python sources
        run: |
          .venv/bin/python -m py_compile store.py
          .venv/bin/python -m py_compile store_1.0.1_amd64/usr/local/bin/store

      - name: Import application
        run: |
          .venv/bin/python - <<'PY'
          import store
          assert hasattr(store, "LumaStore")
          assert hasattr(store, "LumaStoreWindow")
          assert hasattr(store, "NativeSupabaseAuth")
          assert hasattr(store, "DeveloperDashboardApi")
          print("Luma Store native GTK import OK")
          PY
